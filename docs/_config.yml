theme: jekyll-theme-minimal
remote_theme: pmarsceill/just-the-docs
title: XpertEval
description: 全模态大模型一站式评测框架
logo: /assets/images/logo.png
aux_links:
  "GitHub":
    - "https://github.com/XpertMedAI/XpertEval"

# 颜色设置
color_scheme: light

# 启用右侧目录
toc:
  enabled: true
  h_min: 2
  h_max: 3

# 导航设置
nav_external_links:
  - title: XpertEval on GitHub
    url: https://github.com/XpertMedAI/XpertEval
    hide_icon: false

# 搜索设置
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# 启用代码高亮
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 页脚设置
footer_content: "Copyright &copy; 2025 XpertEval Team. 基于 <a href=\"https://github.com/pmarsceill/just-the-docs\">Just the Docs</a> 主题."

# 自定义CSS和JS
head_scripts:
  - url: https://cdn.jsdelivr.net/npm/mermaid@8.13.3/dist/mermaid.min.js
    crossorigin: anonymous

# 自定义样式
callouts:
  warning:
    title: 警告
    color: red
  note:
    title: 注意
    color: blue
  tip:
    title: 提示
    color: green

# 启用回到顶部按钮
back_to_top: true
back_to_top_text: "返回顶部"

# 启用锚点链接
heading_anchors: true

# 启用复制代码按钮
enable_copy_code_button: true

# 启用深色模式切换
color_scheme: nil

# 自定义样式，模拟Ant Design风格
sass:
  style: compressed

# 导航菜单
navigation:
  - title: 首页
    url: /
  - title: 快速开始
    url: /quick_start
  - title: 用户手册
    url: /user_manual/
    submenu:
      - title: 配置指南
        url: /user_manual/configuration.html
      - title: WebUI 使用说明
        url: /user_manual/web_ui.html
  - title: 数据集文档
    url: /datasets/
    submenu:
      - title: 数据集概览
        url: /datasets/index.html
      - title: XpertFormat 规范
        url: /datasets/xpert_format_spec.html
      - title: 数据集转换工具
        url: /datasets/dataset_conversion.html
      - title: 数据集使用指南
        url: /datasets/dataset_usage.html
  - title: 开发者指南
    url: /developer_guide/
    submenu:
      - title: 架构设计
        url: /developer_guide/architecture.html
      - title: 扩展指南
        url: /developer_guide/extending.html

# 页脚信息
footer:
  copyright: Copyright © 2025 XpertEval Team
  links:
    - title: GitHub
      url: https://github.com/XpertMedAI/XpertEval
    - title: 问题反馈
      url: https://github.com/XpertMedAI/XpertEval/issues

# 自定义颜色，模拟Ant Design的配色
colors:
  primary: "#1890ff"
  link: "#1890ff"
  text: "#000000d9"
  heading: "#000000d9"
  background: "#ffffff"
  footer_background: "#f0f2f5"

# 额外的头部标签，用于引入Ant Design样式
head_extra: |
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.16.13/antd.min.css" integrity="sha512-K3Bjl+cEtCT3xmUgQHJH9Bi0QRkjhkRKAgX8FIFdHCezZTZWKY8L4QsWP0WbGP9NqS4UnM9k/aNfZeBaNZoOw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      color: #000000d9;
    }
    a {
      color: #1890ff;
    }
    a:hover {
      color: #40a9ff;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #000000d9;
    }
    .btn {
      background-color: #1890ff;
      border-color: #1890ff;
    }
    .btn:hover {
      background-color: #40a9ff;
      border-color: #40a9ff;
    }
    .site-header {
      background-color: #001529;
    }
    .site-footer {
      background-color: #f0f2f5;
    }
  </style> 